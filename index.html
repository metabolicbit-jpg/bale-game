<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 مرکز بازی بله</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 مرکز بازی</h1>
            <div class="coins-badge">
                🪙 <span id="userCoins">۰</span>
            </div>
        </header>

        <div class="games-grid">
            <a href="flappy.html" class="game-card">
                <div class="game-icon">🐤</div>
                <h3>پرنده‌پرش</h3>
                <p>بزن و بپر!</p>
                <span class="play-badge">بازی کن ▶</span>
            </a>

            <div class="game-card coming-soon">
                <div class="game-icon">🏃</div>
                <h3>رانر</h3>
                <p>به‌زودی...</p>
                <span class="soon-badge">🔜</span>
            </div>

            <div class="game-card coming-soon">
                <div class="game-icon">🧱</div>
                <h3>بلوک‌شکن</h3>
                <p>به‌زودی...</p>
                <span class="soon-badge">🔜</span>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn active">🎮 بازی‌ها</button>
            <button class="nav-btn">🛒 فروشگاه</button>
            <button class="nav-btn">🏆 رتبه‌بندی</button>
            <button class="nav-btn">📋 کارها</button>
        </nav>
    </div>
</body>
</html>
