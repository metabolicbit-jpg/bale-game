<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>سایه‌پرش | مرکز بازی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="shadow.css?v=1">
<script>
window.addEventListener('error', function(e) {
    var d = document.createElement('div');
    d.textContent = '⚠️ خطا: ' + e.message;
    d.style.cssText = 'position:fixed;top:5px;left:5px;right:5px;z-index:99;background:#7f1d1d;color:#fff;padding:8px;font-size:12px;border-radius:8px;text-align:center;';
    document.body.appendChild(d);
});
</script>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden"><span id="scoreDisplay">۰</span></div>

<div id="startScreen" class="overlay">
  <div class="card">
    <div class="emoji">👤</div>
    <h1>سایه‌پرش</h1>
    <p>سایه‌ات مسیرِ آخرین بازیت رو دوباره پرواز می‌کنه.<br>اگه به سایهٔ خودت بخوری، تمومه!</p>
    <div class="best">🏆 رکورد تو: <span id="bestScore">۰</span></div>
    <button id="startBtn" class="btn">شروع پرواز</button>
  </div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <div class="card">
    <div class="emoji">💥</div>
    <h1 id="deathReason">باختی!</h1>
    <div class="stats">
      <div>امتیاز: <span id="finalScore">۰</span></div>
      <div>سکه: <span id="coinsEarned">۰</span></div>
    </div>
    <button id="retryBtn" class="btn">یه دست دیگه!</button>
    <button id="menuBtn" class="btn btn-ghost">منو</button>
  </div>
</div>

<script src="shadow.js?v=1"></script>
</body>
</html>
